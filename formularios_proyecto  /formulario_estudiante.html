<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario estudiante</title>
</head>
<body>
    <h1>DATOS DE ESTUDIANTE PARA EL SERVICIO SOCIAL</h1>
    <form action="#" method="">
        <fieldset>
            <legend>Datos del estudiante</legend>
            <label for="nombre_est">Nombre:</label>
            <input type="text" name="nombre_est" id="nombre_est">
            <br><br>
            <label for="apellido_pat_est">Apellido paterno:</label>
            <input type="text" name="apellido_pat_est" id="apellido_pat_est">
            <label for="apellido_mat_est">Apellido materno:</label>
            <input type="text" name="apellido_mat_est" id="apellido_mat_est">
            <br><br>
            <label for="grado">Grado que esta cursando:</label>
            <select name="grado" id="grado">
                <option value="10">10</option>
                <option value="11">11</option>
            </select>
            <label for="grupo">Grupo al que pertenece:</label>
            <select name="grupo" id="grupo">
                <option value="10-1">10-1</option>
                <option value="10-2">10-2</option>
                <option value="10-3">10-3</option>
                <option value="10-4">10-4</option>
                <option value="10-5">10-5</option>
                <option value="10-6">10-6</option>
                <option value="11-1">11-1</option>
                <option value="11-2">11-2</option>
                <option value="11-3">11-3</option>
                <option value="11-4">11-4</option>
                <option value="11-5">11-5</option>
                <option value="11-6">11-6</option>
            </select>
            <br><br>
            <label for="celular">Celular:</label>
            <input type="number" name="celular" id="celular">
            <label for="direccion">Dirección de vivienda:</label>
            <input type="text" name="direccion" id="direccion">
            <br><br>
            <label for="correo">Correo electronico:</label>
            <input type="email" name="correo" id="correo">
            <label for="eps">EPS a la que pertenece:</label>
            <input type="text" name="eps" id="eps">
            <br><br>
            <label for="seguro_estudiantil">Adjunte el documento del seguro estudiantil:</label>
            <input type="file" name="seguro seguro_estudiantil" id="seguro_estudiantil">
            <br><br>
            <label for="contraseña">Contraseña para un futuro ingreso:</label>
            <input type="password" name="contraseña" id="contraseña">
        </fieldset>
    </form>
</body>
</html>

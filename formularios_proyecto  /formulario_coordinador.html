<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario coordinador</title>
</head>
<body>
    <h1>DATOS DEL COORDINADOR DEL SSEO </h1>
    <form action="#" method="">
        <fieldset>
            <legend>Datos del coordinador SSEO</legend>
            <label for="nombre_coord">Nombre:</label>
            <input type="text" name="nombre_coord" id="nombre_coord">
            <br><br>
            <label for="apellido_pat_coord">Apellido paterno:</label>
            <input type="text" name="apellido_pat_coord" id="apellido_pat_coord">
            <label for="apellido_mat_coord">Apellido materno:</label>
            <input type="text" name="apellido_mat_coord" id="apellido_mat_coord">
            <br><br>
            <label for="documento_coord">Documento:</label>
            <input type="number" name="documento_coord" id="documento_coord">
            <br><br>
            <label for="correo_coord">Correo electrónico:</label>
            <input type="email" name="correo_coord" id="correo_coord">
            <br><br>
            <label for="contraseña_coord">Contraseña:</label>
            <input type="password" name="contraseña_coord" id="contraseña_coord">
        </fieldset>
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULARIO DEL SUPERVISOR</title>
</head>
<body>
    <h1>DATOS DEL SEPERVISOR</h1>
    <form action="#" method="">
        <fieldset>
            <legend>Datos del supervisor</legend>
            <label for="nombre_sup">Nombre:</label>
            <input type="text" name="nombre_sup" id="nombre_sup">
            <br><br>
            <label for="apellido_pat_sup">Apellido paterno:</label>
            <input type="text" name="apellido_pat_sup" id="apellido_pat_sup">
            <label for="apellido_mat_sup">Apellido materno:</label>
            <input type="text" name="apellido_mat_sup" id="apellido_mat_sup">
            <br><br>
            <label for="cargo">Cargo dentro de la institución:</label>
            <input type="text" name="cargo" id="cargo">
            <label for="dependencia">Dependencia:</label>
            <input type="text" name="dependencia" id="dependencia">
            <br><br>
            <label for="sede">Sede:</label>
            <input type="text" name="sede" id="sede">
            <label for="celular_sup">Celular:</label>
            <input type="number" name="celular_sup" id="celular_sup">
            <br><br>
            <label for="correo_sup">Correo electrónico:</label>
            <input type="email" name="correo_sup" id="correo_sup">
            <br><br>
            <label for="contraseña_sup">Contraseña:</label>
            <input type="password" name="contraseña_sup" id="contraseña_sup">
        </fieldset>
</form>
</body>
</html>

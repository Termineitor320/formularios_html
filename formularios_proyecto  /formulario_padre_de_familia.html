<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario padre de familia</title>
</head>
<body>
    <h1>DATOS DEL PADRE DE FAMILIA</h1>
    <form action="#" method="">
        <fieldset>
            <legend>Datos del padre de familia</legend>
            <label for="nombre_padre">Nombre:</label>
            <input type="text" name="nombre_padre" id="nombre_padre">
            <br><br>
            <label for="apellido_pat_padre">Apellido paterno:</label>
            <input type="text" name="apellido_pat_padre" id="apellido_pat_padre">
            <label for="apellido_mat_padre">Apellido materno:</label>
            <input type="text" name="apellido_mat_padre" id="apellido_mat_padre">
            <br><br>
            <label for="celular_padre">Celular:</label>
            <input type="number" name="celular_padre" id="celular_padre">
            <label for="direccion_padre">Dirección:</label>
            <input type="text" name="direccion_padre" id="direccion_padre">
            <br><br>
            <label for="correo_padre">Correo electrónico:</label>
            <input type="email" name="correo_padre" id="correo_padre">
            <br><br>
            <label for="contraseña_padre">Contraseña:</label>
            <input type="password" name="contraseña_padre" id="contraseña_padre">
        </fieldset>
</form>
</body>
</html>
